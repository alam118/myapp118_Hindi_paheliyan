<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>पहेली · 20 श्रेणियाँ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Mangal', 'Devanagari New', system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(145deg, #0f0c1a, #1a1230);
            position: fixed;
            top: 0;
            left: 0;
        }
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: rgba(25, 18, 45, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 18px 20px;
            box-shadow: none;
            border: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .app-container::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 60% 30%, rgba(160, 120, 220, 0.06), transparent 50%);
            pointer-events: none;
        }
        .app-container::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -20%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 40% 70%, rgba(100, 80, 200, 0.04), transparent 50%);
            pointer-events: none;
        }

        /* Status Bar Spacer */
        .status-bar {
            height: env(safe-area-inset-top, 8px);
            flex-shrink: 0;
        }

        h1 {
            text-align: center;
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #e8d5f5;
            text-shadow: 0 4px 20px #000000aa, 0 0 30px rgba(160, 120, 220, 0.15);
            border-bottom: 1px solid rgba(180, 130, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        h1 small {
            font-size: 0.8rem;
            background: rgba(160, 120, 220, 0.15);
            padding: 2px 16px;
            border-radius: 80px;
            font-weight: 300;
            color: #d4c0e8;
            border: 1px solid rgba(180, 130, 255, 0.3);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px #00000040;
        }

        /* ----- Category Menu Toggle ----- */
        .menu-toggle-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .btn-home {
            background: rgba(47, 34, 63, 0.8);
            border: 1px solid rgba(160, 120, 220, 0.3);
            color: #d4c0e8;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }
        .btn-home:hover {
            background: rgba(93, 68, 115, 0.8);
            border-color: #c8a0e8;
            transform: scale(0.96);
            color: #fff;
        }
        .btn-home.active {
            background: linear-gradient(135deg, #8a6ab8, #6a4a98);
            color: #fff;
            border-color: #c8a0e8;
            box-shadow: 0 0 25px rgba(160, 120, 220, 0.2);
        }
        .category-label {
            color: #c8b8d8;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            background: rgba(47, 34, 63, 0.5);
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 220, 0.15);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
        }
        .category-label span {
            font-weight: 500;
            color: #e8d5f5;
        }

        /* ----- Side Navigation Menu ----- */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .nav-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .nav-sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            max-width: 82vw;
            height: 100%;
            background: rgba(20, 14, 40, 0.98);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(160, 120, 220, 0.2);
            box-shadow: 4px 0 40px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px 14px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .nav-sidebar.open {
            left: 0;
        }
        .nav-sidebar::-webkit-scrollbar {
            width: 3px;
        }
        .nav-sidebar::-webkit-scrollbar-track {
            background: rgba(47, 34, 63, 0.3);
            border-radius: 10px;
        }
        .nav-sidebar::-webkit-scrollbar-thumb {
            background: #8a6ab8;
            border-radius: 10px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(160, 120, 220, 0.15);
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .sidebar-title {
            color: #e8d5f5;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-title small {
            font-size: 0.7rem;
            color: rgba(180, 160, 200, 0.5);
            font-weight: 300;
        }
        .btn-close-sidebar {
            background: rgba(47, 34, 63, 0.6);
            border: 1px solid rgba(160, 120, 220, 0.2);
            color: #c8b8d8;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-close-sidebar:hover {
            background: rgba(93, 68, 115, 0.8);
            border-color: #c8a0e8;
            color: #fff;
        }

        .sidebar-categories {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            overflow-y: auto;
        }
        .sidebar-categories .cat-btn {
            background: rgba(47, 34, 63, 0.4);
            border: 1px solid rgba(160, 120, 220, 0.08);
            color: #c8b8d8;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-categories .cat-btn:hover {
            background: rgba(93, 68, 115, 0.5);
            border-color: rgba(160, 120, 220, 0.2);
            color: #fff;
            transform: translateX(3px);
        }
        .sidebar-categories .cat-btn.active {
            background: linear-gradient(135deg, #8a6ab8, #6a4a98);
            color: #fff;
            border-color: #c8a0e8;
            box-shadow: 0 0 20px rgba(160, 120, 220, 0.15);
            font-weight: 600;
        }
        .sidebar-categories .cat-btn .cat-icon {
            font-size: 1rem;
            width: 24px;
            text-align: center;
        }
        .sidebar-categories .cat-btn .cat-name {
            flex: 1;
            font-size: 0.82rem;
        }
        .sidebar-categories .cat-btn .cat-count {
            font-size: 0.65rem;
            color: rgba(180, 160, 200, 0.4);
            background: rgba(47, 34, 63, 0.4);
            padding: 1px 8px;
            border-radius: 20px;
        }
        .sidebar-categories .cat-btn.active .cat-count {
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(160, 120, 220, 0.1);
            flex-shrink: 0;
            color: rgba(180, 160, 200, 0.3);
            font-size: 0.7rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ----- Question Panel (Flexible) ----- */
        .question-panel {
            background: rgba(26, 18, 42, 0.85);
            border-radius: 28px;
            padding: 18px 18px 18px;
            border: 1px solid rgba(160, 120, 220, 0.15);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.4), 0 8px 30px rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .question-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(160, 120, 220, 0.04), transparent 60%);
            pointer-events: none;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .q-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .q-number {
            font-size: 0.8rem;
            color: #d4c0e8;
            letter-spacing: 1px;
            background: rgba(47, 34, 63, 0.8);
            padding: 3px 16px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 220, 0.3);
            box-shadow: 0 2px 8px black;
            font-weight: 300;
        }
        .q-total {
            font-size: 0.7rem;
            color: rgba(180, 160, 200, 0.5);
            background: rgba(47, 34, 63, 0.4);
            padding: 2px 10px;
            border-radius: 40px;
            border: 1px solid rgba(160, 120, 220, 0.12);
        }
        .btn-bookmark {
            background: rgba(47, 34, 63, 0.7);
            border: 1px solid rgba(160, 120, 220, 0.2);
            color: #b8a8c8;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
        }
        .btn-bookmark:hover {
            background: rgba(93, 68, 115, 0.8);
            border-color: #c8a0e8;
            transform: scale(0.96);
        }
        .btn-bookmark.bookmarked {
            background: rgba(160, 120, 220, 0.25);
            border-color: #c8a0e8;
            color: #e8d5f5;
            box-shadow: 0 0 25px rgba(160, 120, 220, 0.15);
        }
        .btn-bookmark.bookmarked::before {
            content: '⭐ ';
        }

        /* Timer */
        .timer-round {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
        }
        .timer-round svg {
            transform: rotate(-90deg);
            width: 52px;
            height: 52px;
        }
        .timer-round .bg-circle {
            fill: none;
            stroke: rgba(58, 42, 78, 0.6);
            stroke-width: 4;
        }
        .timer-round .progress-circle {
            fill: none;
            stroke: #c8a0e8;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 125.66;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s;
            filter: drop-shadow(0 0 8px rgba(160, 120, 220, 0.15));
        }
        .timer-round .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e8d5f5;
            font-size: 0.95rem;
            font-weight: 600;
            text-shadow: 0 0 16px #000000cc;
            letter-spacing: 0.5px;
        }
        .timer-round .timer-text.done {
            color: #96d6b0;
            font-size: 0.8rem;
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.5;
            font-weight: 400;
            color: #f5ecfa;
            text-shadow: 0 3px 14px #00000080;
            word-break: break-word;
            padding-right: 4px;
            margin-top: 4px;
            position: relative;
            z-index: 1;
            flex: 1;
            overflow-y: auto;
            min-height: 60px;
            max-height: 40vh;
        }
        .question-text::-webkit-scrollbar {
            width: 2px;
        }
        .question-text::-webkit-scrollbar-thumb {
            background: #8a6ab8;
            border-radius: 10px;
        }

        .answer-box {
            margin-top: 10px;
            background: rgba(17, 13, 32, 0.9);
            border-radius: 60px;
            padding: 10px 16px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 6px solid #c8a0e8;
            box-shadow: 0 6px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(160, 120, 220, 0.1);
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .answer-text {
            font-size: 1.1rem;
            color: #e8d5f5;
            font-weight: 300;
            padding: 4px 0;
            letter-spacing: 0.3px;
            flex: 1;
            min-width: 80px;
        }
        .action-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-icon {
            background: rgba(58, 43, 81, 0.8);
            border: 1px solid rgba(160, 120, 220, 0.25);
            color: #e0d0ec;
            padding: 5px 14px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 0 #1f1422, 0 4px 14px black;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
        }
        .btn-icon:hover {
            background: #6a4a88;
            transform: scale(0.96);
            border-color: #c8a0e8;
            color: white;
            box-shadow: 0 2px 0 #1f1422, 0 4px 14px black;
        }
        .btn-icon:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1f1422;
        }
        .btn-icon.share-wa {
            background: rgba(31, 74, 60, 0.8);
            border-color: rgba(103, 179, 139, 0.35);
            color: #e3f0e8;
        }
        .btn-icon.share-wa:hover {
            background: #2f735a;
            border-color: #9ed6b3;
        }

        .bookmark-status {
            text-align: center;
            margin-top: 6px;
            color: rgba(180, 160, 200, 0.4);
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        /* Navigation Controls */
        .nav-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 8px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .btn-nav {
            background: rgba(43, 31, 56, 0.8);
            border: 1px solid rgba(160, 120, 220, 0.15);
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #e0d0ec;
            box-shadow: 0 4px 0 #0f0b12, 0 6px 20px black;
            cursor: pointer;
            transition: 0.06s linear;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 1 0 auto;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .btn-nav:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f0b12;
        }
        .btn-nav:disabled {
            opacity: 0.3;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0f0b12;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        /* Jump Section */
        .jump-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px 12px;
            background: rgba(28, 20, 42, 0.6);
            border-radius: 60px;
            padding: 8px 18px;
            border: 1px solid rgba(160, 120, 220, 0.1);
            backdrop-filter: blur(6px);
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .jump-section label {
            color: #c8b8d8;
            font-weight: 300;
            font-size: 0.85rem;
        }
        .jump-input {
            background: rgba(15, 10, 28, 0.8);
            border: 1px solid rgba(160, 120, 220, 0.3);
            border-radius: 60px;
            padding: 6px 12px;
            width: 60px;
            font-size: 1rem;
            font-weight: 500;
            color: #f4e3d0;
            text-align: center;
            outline: none;
            box-shadow: inset 0 2px 12px black;
        }
        .jump-input:focus {
            border-color: #c8a0e8;
            background: rgba(32, 27, 48, 0.9);
            box-shadow: 0 0 0 3px rgba(160, 120, 220, 0.15);
        }
        .btn-jump-go {
            background: linear-gradient(135deg, #8a6ab8, #6a4a98);
            border: none;
            padding: 6px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a2a68, 0 4px 18px black;
            transition: 0.06s linear;
            border: 1px solid rgba(180, 130, 255, 0.25);
        }
        .btn-jump-go:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4a2a68;
        }

        .total-riddles-info {
            text-align: center;
            color: rgba(180, 160, 200, 0.3);
            font-size: 0.65rem;
            margin-top: 6px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 20, 50, 0.95);
            color: #e8d5f5;
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid rgba(160, 120, 220, 0.25);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            font-size: 0.85rem;
            transition: transform 0.4s ease, opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app-container { padding: 10px 12px 14px; }
            h1 { font-size: 1.4rem; padding-bottom: 8px; margin-bottom: 8px; }
            h1 small { font-size: 0.65rem; padding: 2px 12px; }
            .btn-home { font-size: 0.8rem; padding: 6px 12px; }
            .category-label { font-size: 0.75rem; padding: 4px 12px; max-width: 40%; }
            .question-text { font-size: 1.1rem; min-height: 50px; max-height: 35vh; }
            .answer-text { font-size: 0.95rem; }
            .q-number { font-size: 0.7rem; padding: 2px 12px; }
            .btn-nav { font-size: 0.8rem; padding: 6px 12px; }
            .timer-round { width: 44px; height: 44px; }
            .timer-round svg { width: 44px; height: 44px; }
            .timer-round .timer-text { font-size: 0.8rem; }
            .btn-icon { font-size: 0.7rem; padding: 4px 10px; }
            .question-panel { padding: 12px 12px 14px; border-radius: 20px; }
            .answer-box { padding: 8px 12px 8px 16px; border-left-width: 4px; }
            .jump-section { padding: 6px 14px; }
            .jump-input { width: 50px; font-size: 0.85rem; padding: 4px 10px; }
            .btn-jump-go { font-size: 0.8rem; padding: 4px 16px; }
            .nav-sidebar { width: 270px; padding: 14px 10px 16px; }
            .sidebar-categories .cat-btn { font-size: 0.75rem; padding: 6px 10px; }
            .sidebar-categories .cat-btn .cat-name { font-size: 0.72rem; }
            .sidebar-title { font-size: 0.95rem; }
            .bookmark-status { font-size: 0.6rem; }
            .total-riddles-info { font-size: 0.55rem; }
        }

        @media (max-width: 380px) {
            .app-container { padding: 6px 8px 10px; }
            h1 { font-size: 1.1rem; }
            .question-text { font-size: 0.95rem; }
            .btn-nav { font-size: 0.7rem; padding: 4px 10px; }
            .action-group { gap: 4px; }
            .btn-icon { font-size: 0.6rem; padding: 3px 8px; }
            .q-header-left { gap: 4px; }
            .q-number { font-size: 0.6rem; padding: 2px 8px; }
            .btn-bookmark { font-size: 0.6rem; padding: 2px 8px; }
        }

        /* Landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            .question-text { max-height: 25vh; font-size: 1rem; min-height: 40px; }
            .question-panel { padding: 10px 14px 10px; }
            .q-header { margin-bottom: 4px; }
            .answer-box { margin-top: 6px; padding: 6px 12px 6px 16px; }
            .nav-controls { margin: 4px 0; }
            .jump-section { padding: 4px 12px; }
            h1 { font-size: 1.2rem; padding-bottom: 4px; margin-bottom: 4px; }
            .timer-round { width: 36px; height: 36px; }
            .timer-round svg { width: 36px; height: 36px; }
            .timer-round .timer-text { font-size: 0.65rem; }
            .menu-toggle-area { margin-bottom: 4px; }
        }

                const btn = document.createElement('button');
                btn.className = `cat-btn${index === 0 ? ' active' : ''}`;
                btn.dataset.cat = index;
                const count = ALL_CATEGORIES[index].length;
                btn.innerHTML = `
                    <span class="cat-icon">${CATEGORY_ICONS[index] || '📌'}</span>
                    <span class="cat-name">${name.replace(/[^\w\s]/g, '').trim()}</span>
                    <span class="cat-count">${count}</span>
                `;
                sidebarCategories.appendChild(btn);
            });
            document.querySelectorAll('#sidebarCategories .cat-btn').forEach((btn) => {
                btn.addEventListener('click', function() {
                    const cat = parseInt(this.dataset.cat);
                    if (cat !== currentCategory) loadCategory(cat);
                    closeSidebar();
                });
            });
        }
        generateSidebar();

        function openSidebar() {
            sidebarOpen = true;
            navSidebar.classList.add('open');
            navOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebarOpen = false;
            navSidebar.classList.remove('open');
            navOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        function toggleSidebar() {
            sidebarOpen ? closeSidebar() : openSidebar();
        }

        homeBtn.addEventListener('click', toggleSidebar);
        navOverlay.addEventListener('click', closeSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sidebarOpen) closeSidebar(); });

        // Bookmark
        function toggleBookmark() {
            const cat = currentCategory;
            const idx = currentIndex;
            if (!bookmarks[cat]) bookmarks[cat] = [];
            const bIdx = bookmarks[cat].indexOf(idx);
            if (bIdx === -1) {
                bookmarks[cat].push(idx);
                bookmarkBtn.classList.add('bookmarked');
                bookmarkStatus.textContent = '⭐ बुकमार्क किया!';
                bookmarkStatus.style.color = '#e8d5f5';
                showToast('⭐ बुकमार्क किया!');
            } else {
                bookmarks[cat].splice(bIdx, 1);
                bookmarkBtn.classList.remove('bookmarked');
                bookmarkStatus.textContent = '📌 बुकमार्क करें';
                bookmarkStatus.style.color = 'rgba(180, 160, 200, 0.4)';
                showToast('📌 हटा दिया');
            }
            try { localStorage.setItem('paheli_bookmarks', JSON.stringify(bookmarks)); } catch(e) {}
            setTimeout(() => {
                if (bookmarks[cat] && bookmarks[cat].includes(idx)) {
                    bookmarkStatus.textContent = '⭐ बुकमार्क किया!';
                } else {
                    bookmarkStatus.textContent = '📌 बुकमार्क करें';
                    bookmarkStatus.style.color = 'rgba(180, 160, 200, 0.4)';
                }
            }, 2000);
        }

        function updateBookmarkUI() {
            const cat = currentCategory;
            const idx = currentIndex;
            if (bookmarks[cat] && bookmarks[cat].includes(idx)) {
                bookmarkBtn.classList.add('bookmarked');
                bookmarkStatus.textContent = '⭐ बुकमार्क किया!';
                bookmarkStatus.style.color = '#e8d5f5';
            } else {
                bookmarkBtn.classList.remove('bookmarked');
                bookmarkStatus.textContent = '📌 बुकमार्क करें';
                bookmarkStatus.style.color = 'rgba(180, 160, 200, 0.4)';
            }
        }

        try {
            const saved = localStorage.getItem('paheli_bookmarks');
            if (saved) {
                bookmarks = JSON.parse(saved);
                for (let cat in bookmarks) {
                    const maxLen = ALL_CATEGORIES[parseInt(cat)]?.length || 0;
                    bookmarks[cat] = bookmarks[cat].filter(idx => idx >= 0 && idx < maxLen);
                    if (bookmarks[cat].length === 0) delete bookmarks[cat];
                }
            }
        } catch(e) {}

        function loadCategory(catIndex) {
            currentCategory = catIndex;
            currentList = ALL_CATEGORIES[catIndex].map((item, i) => ({ ...item, id: i }));
            currentIndex = 0;
            revealAnswer = false;
            categoryLabel.textContent = CATEGORY_NAMES[catIndex].replace(/[^\w\s]/g, '').trim();
            updateDisplay();
            document.querySelectorAll('#sidebarCategories .cat-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === catIndex);
            });
            updateBookmarkUI();
        }

        // Timer
        function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

        function updateTimerUI(seconds, isDone = false) {
            const fraction = seconds / TOTAL_SECONDS;
            const offset = CIRCUMFERENCE * (1 - fraction);
            progressCircle.style.strokeDashoffset = offset;
            timerText.textContent = isDone ? '✓' : seconds;
            if (isDone) {
                timerText.classList.add('done');
                progressCircle.style.stroke = '#96d6b0';
            } else {
                timerText.classList.remove('done');
                progressCircle.style.stroke = '#c8a0e8';
            }
        }

        function startTimer() {
            stopTimer();
            if (revealAnswer) { updateTimerUI(0, true); return; }
            timerSeconds = TOTAL_SECONDS;
            updateTimerUI(timerSeconds);
            timerInterval = setInterval(() => {
                timerSeconds -= 1;
                if (timerSeconds <= 0) {
                    timerSeconds = 0;
                    updateTimerUI(0, true);
                    stopTimer();
                    if (!revealAnswer) {
                        revealAnswer = true;
                        updateDisplay();
                        playTimerEndSound();
                        showToast('⏰ समय समाप्त!');
                    }
                } else {
                    updateTimerUI(timerSeconds);
                }
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            if (revealAnswer) { updateTimerUI(0, true); return; }
            timerSeconds = TOTAL_SECONDS;
            updateTimerUI(timerSeconds);
            startTimer();
        }

        function updateDisplay() {
            const qData = currentList[currentIndex];
            if (!qData) return;
            const num = currentIndex + 1;
            qNumberDisplay.textContent = `प्रश्न ${num}`;
            qTotalDisplay.textContent = `/ ${currentList.length}`;
            questionDisplay.textContent = qData.q;
            answerDisplay.textContent = revealAnswer ? qData.a : '👉 उत्तर छिपा है';
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === currentList.length - 1);
            jumpInput.value = num;
            jumpInput.max = currentList.length;
            updateBookmarkUI();
            if (!revealAnswer) resetTimer();
            else { stopTimer(); updateTimerUI(0, true); }
        }

        function goTo(index) {
            if (index < 0) index = 0;
            if (index >= currentList.length) index = currentList.length - 1;
            if (currentIndex !== index) {
                currentIndex = index;
                revealAnswer = false;
                updateDisplay();
            } else { updateDisplay(); }
        }

        function next() { if (currentIndex < currentList.length - 1) goTo(currentIndex + 1); }
        function prev() { if (currentIndex > 0) goTo(currentIndex - 1); }
        function jumpTo() {
            let val = parseInt(jumpInput.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            if (val > currentList.length) val = currentList.length;
            jumpInput.value = val;
            goTo(val - 1);
        }

        function getFullText() {
            const qData = currentList[currentIndex];
            if (!qData) return '';
            const answer = revealAnswer ? qData.a : 'उत्तर छिपा है';
            const catName = CATEGORY_NAMES[currentCategory].replace(/[^\w\s]/g, '').trim();
            return `🧩 पहेली (${catName}): ${qData.q}\n✅ उत्तर: ${answer}`;
        }

        function copyFull() {
            const text = getFullText();
            if (!text) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast('✅ कॉपी!')).catch(() => fallbackCopy(text));
            } else { fallbackCopy(text); }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); showToast('✅ कॉपी!'); } catch(e) { showToast('❌ कॉपी नहीं'); }
            document.body.removeChild(ta);
        }

        function shareWhatsApp() {
            const text = getFullText();
            if (!text) return;
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            const win = window.open(url, '_blank');
            if (!win || win.closed || typeof win.closed === 'undefined') { window.location.href = url; }
            showToast('📲 WhatsApp...');
        }

        // Events
        prevBtn.addEventListener('click', prev);
        nextBtn.addEventListener('click', next);
        jumpBtn.addEventListener('click', jumpTo);
        jumpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') jumpTo(); });
        copyBtn.addEventListener('click', copyFull);
        shareBtn.addEventListener('click', shareWhatsApp);
        bookmarkBtn.addEventListener('click', toggleBookmark);

        // Init
        progressCircle.style.strokeDasharray = CIRCUMFERENCE;
        categoryLabel.textContent = 'Easy';
        loadCategory(0);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
            if (e.key === 'b' || e.key === 'B') { toggleBookmark(); }
            if (e.key === 'm' || e.key === 'M') { toggleSidebar(); }
        });

        window.addEventListener('beforeunload', () => { stopTimer(); });

        // Handle orientation change
        window.addEventListener('resize', () => {
            // Just ensure UI stays responsive
        });
    })();
</script>
</body>
</html>
